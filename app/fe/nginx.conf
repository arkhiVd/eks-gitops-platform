# fe: ported from nginx-nlb-microservice-chain/userdata/fe.sh. The internal NLB is gone;
# kube-dns resolves the app1 Service instead.
server {
    listen 8080;
    server_tokens off;

    location /api/ {
        proxy_pass http://app1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        return 200 "FE Server Running\n";
    }
}
