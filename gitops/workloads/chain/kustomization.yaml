    newName: 348032171026.dkr.ecr.us-east-1.amazonaws.com/eks-gitops/fe
    newTag: 9e0ba8c8f02b
  - name: app1
    newName: 348032171026.dkr.ecr.us-east-1.amazonaws.com/eks-gitops/app1
    newTag: 9e0ba8c8f02b
  - name: app2
    newName: 348032171026.dkr.ecr.us-east-1.amazonaws.com/eks-gitops/app2
    newTag: 9e0ba8c8f02b
