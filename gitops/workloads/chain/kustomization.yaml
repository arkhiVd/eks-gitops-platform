apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chain
resources:
  - namespace.yaml
  - fe.yaml
  - app1.yaml
  - app2.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: chain
    includeSelectors: false
