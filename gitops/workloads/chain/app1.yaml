apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: chain
  annotations:
    checkov.io/skip1: CKV_K8S_43=Kustomize sets an immutable ECR tag (commit SHA); IMMUTABLE repos make tag and digest equivalent
    checkov.io/skip2: CKV_K8S_14=Tag is set by kustomization.yaml images, not in this base file
    checkov.io/skip3: CKV_K8S_11=No CPU limit on purpose, to avoid CFS throttling; requests drive scheduling and the HPA
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: app1 }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: app1 }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # Hard rule: ScheduleAnyway let all six chain pods land on one node (Phase 4).
          whenUnsatisfiable: DoNotSchedule
          # Count only pods of the same ReplicaSet; old pods mid-rollout skewed placement onto one node.
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels: { app: app1 }
      containers:
        - name: app1
          image: app1
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - { name: APP2_URL, value: "http://app2:8082/api/downstream" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Keep serving while kube-proxy on every node drops this pod from the Service; without it the Phase 5 rollback drill saw a 502.
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }

---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: chain
spec:
  selector: { app: app1 }
  ports:
    - { name: http, port: 8081, targetPort: http }
