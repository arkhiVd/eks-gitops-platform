apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: chain
  annotations:
    checkov.io/skip1: CKV_K8S_43=Kustomize sets an immutable ECR tag (commit SHA); IMMUTABLE repos make tag and digest equivalent
    checkov.io/skip2: CKV_K8S_14=Tag is set by kustomization.yaml images, not in this base file
    checkov.io/skip3: CKV_K8S_11=No CPU limit on purpose, to avoid CFS throttling; requests drive scheduling and the HPA
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: app2 }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: app2 }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # Hard rule: ScheduleAnyway let all six chain pods land on one node (Phase 4).
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: app2 }
      containers:
        - name: app2
          image: app2
          ports:
            - { name: http, containerPort: 8082 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Keep serving while kube-proxy on every node drops this pod from the Service; without it the Phase 5 rollback drill saw a 502.
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }

---
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: chain
spec:
  selector: { app: app2 }
  ports:
    - { name: http, port: 8082, targetPort: http }
