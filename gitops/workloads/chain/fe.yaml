apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe
  namespace: chain
  annotations:
    checkov.io/skip1: CKV_K8S_43=Kustomize sets an immutable ECR tag (commit SHA); IMMUTABLE repos make tag and digest equivalent
    checkov.io/skip2: CKV_K8S_14=Tag is set by kustomization.yaml images, not in this base file
    checkov.io/skip3: CKV_K8S_11=No CPU limit on purpose, to avoid CFS throttling; requests drive scheduling and the HPA
    checkov.io/skip4: CKV_K8S_40=nginx-unprivileged image uses fixed UID 101
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: fe }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: fe }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # Hard rule: ScheduleAnyway let all six chain pods land on one node (Phase 4).
          whenUnsatisfiable: DoNotSchedule
          # Count only pods of the same ReplicaSet; old pods mid-rollout skewed placement onto one node.
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels: { app: fe }
      containers:
        - name: fe
          image: fe
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Outlast the ALB deregistration delay (15 s) with margin. 15 s exactly still lost
          # 10 of 7,496 requests in the Phase 5 rollout under load.
          lifecycle:
            preStop:
              exec: { command: ["sleep", "25"] }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fe
  namespace: chain
spec:
  selector: { app: fe }
  ports:
    - { name: http, port: 80, targetPort: http }
