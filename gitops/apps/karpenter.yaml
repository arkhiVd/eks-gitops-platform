apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.15.1
    helm:
      valuesObject:
        settings:
          clusterName: eks-gitops
          interruptionQueue: eks-gitops-karpenter
        serviceAccount:
          name: karpenter
        replicas: 1
        # Run only on the managed node group, never on nodes Karpenter itself launched.
        nodeSelector:
          node-role: system
        controller:
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
