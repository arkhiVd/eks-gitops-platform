apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: eks-gitops-karpenter-node # infra/karpenter.tf, fixed name
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-gitops
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-gitops
  # Same hardening as the managed node group: IMDSv2 only, pods cannot reach node credentials.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  # Tags let the Phase 7 teardown sweep find anything Karpenter left behind.
  tags:
    project: eks-gitops-platform
    owner: arkhiVd
