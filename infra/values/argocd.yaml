# Argo CD 3.6 (chart 10.17.2). Reached with kubectl port-forward only; no Ingress.
global:
  domain: localhost

configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
    exec.enabled: false
  repositories:
    karpenter:
      name: karpenter
      type: helm
      url: public.ecr.aws/karpenter
      enableOCI: "true"

dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

server:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

applicationSet:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }

redis:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }
